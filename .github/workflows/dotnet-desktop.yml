name: Pull Request Check (.NET)

# Trigger: Startet bei jedem PR gegen main oder master
on:
  pull_request:
    branches: [ main, master ]

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      # 1. Code aus dem Repository herunterladen
      - name: Code auschecken
        uses: actions/checkout@v4

      # 2. .NET SDK auf dem Server installieren
      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Ersetze 8.0.x durch deine .NET-Version (z. B. '9.0.x')

      # 3. NuGet-Pakete wiederherstellen
      - name: NuGet-Pakete wiederherstellen
        run: dotnet restore

      # 4. Projekt/Solution bauen
      - name: Projekt bauen (Kompilierprüfung)
        run: dotnet build --no-restore --configuration Release
